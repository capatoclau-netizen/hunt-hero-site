<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hunt Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Baiak client palette: warm stone surfaces, brand gold ink */
      :root {
        --s0: #1b1b19; --s1: #232321; --s2: #30302e; --s3: #3a3a37; --edge: #4a4a46; --edge-hi: #6a675f;
        --ink: #eae8e2; --dim: #a9a69d; --gold: #e8c34e; --gold-d: #b8902a; --bad: #ef5350; --good: #66bb6a;
        --card: #2a2a28; --acc: var(--gold); --muted: var(--dim); --line: #3a3a37; --bg: var(--s0);
        --pixel: 'Silkscreen', ui-monospace, 'Courier New', monospace;
        --body: 'Alegreya Sans', 'Segoe UI', sans-serif;
        --bevel: inset 0 1px 0 #ffffff14, inset 0 -2px 0 #00000059, 0 2px 0 #0000004d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--s0); color: var(--ink); font: 15px/1.35 var(--body); }
      button { background: linear-gradient(#3e3d39, #2f2e2b); color: var(--ink); border: 1px solid var(--edge); border-radius: 4px; padding: 5px 12px; font: 600 14px var(--body); cursor: pointer; box-shadow: var(--bevel); }
      button:hover:not(:disabled) { border-color: var(--gold); color: #fff; }
      button:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 2px 3px #0008; }
      button:disabled { opacity: .4; cursor: default; }
      button.on { background: linear-gradient(#f0d06a, #c79d2c); color: #1a1406; border-color: #f3dc8b; }
      button.gold { background: linear-gradient(#e8c34e, #b48a24); color: #1a1406; border-color: #f3dc8b; }
      button.danger { background: linear-gradient(#7a2626, #561a1a); border-color: var(--bad); }
      /* every shop purchase: confirm box in the middle of the screen */
      #buyconfirm { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: #000a; backdrop-filter: blur(2px); }
      #buyconfirm[hidden] { display: none; }
      .bc-box { width: min(360px, 100%); padding: 22px 22px 18px; background: #18160f; border: 1px solid var(--gold-d); border-radius: 8px; box-shadow: 0 20px 60px #000c, 0 0 0 1px #e8c34e22; text-align: center; }
      .bc-box h3 { margin: 0 0 12px; font: 700 15px var(--pixel); color: var(--gold); letter-spacing: .04em; }
      .bc-what { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
      .bc-cost { margin: 0 0 18px; font-size: 16px; } .bc-cost small { color: var(--dust, #9a937f); }
      .bc-btns { display: flex; gap: 10px; justify-content: center; } .bc-btns button { flex: 1; padding: 10px 0; }
      button.sm { padding: 2px 9px; font-size: 13px; }
      a.buy-hunt { display: inline-block; background: linear-gradient(#e8c34e, #b48a24); color: #1a1406; border: 1px solid #f3dc8b; border-radius: 4px; padding: 2px 9px; font: 600 13px var(--body); text-decoration: none; box-shadow: var(--bevel); }
      a.buy-hunt:hover { color: #000; }
      .demo-tag { font: 700 12px var(--pixel); color: #1a1406; background: #e0603a; border-radius: 3px; padding: 3px 8px; letter-spacing: .04em; }
      button.ghost { background: transparent; box-shadow: none; }
      input, select { background: #121210; color: var(--ink); border: 1px solid var(--edge); border-radius: 4px; padding: 4px 7px; font: inherit; max-width: 100%; }
      .spacer { flex: 1; }
      .muted { color: var(--dim); font-size: 13px; }
      .bad { color: var(--bad); } .good { color: var(--good); }
      [hidden] { display: none !important; }

      /* ---------- top bar ---------- */
      #topbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 18px; background: linear-gradient(#2b2a27f2, #1e1d1bf2); border-bottom: 1px solid var(--edge); box-shadow: 0 2px 10px #0008; backdrop-filter: blur(4px); }
      #topbar .brand { font: 700 18px var(--pixel); color: var(--gold); background: none; border: 0; box-shadow: none; padding: 0; text-shadow: 0 2px 0 #000; letter-spacing: .02em; }
      #topbar .kv { color: var(--dim); white-space: nowrap; font-size: 14px; }
      #topbar .kv b { color: var(--ink); font-variant-numeric: tabular-nums; }
      #topbar .test { font-size: 12px; opacity: .8; }
      #topbar .ingame b { color: var(--gold); font: 700 16px var(--pixel); }
      #topbar .hint { font-size: 11px; color: var(--dim); }
      button small { font-weight: 500; opacity: .75; font-size: 11px; }
      .row > button { white-space: nowrap; flex: none; }
      #topbar input { width: 86px; padding: 2px 6px; }
      #tb-picker { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; vertical-align: middle; white-space: normal; }
      #tb-picker .wpick { display: inline-flex; align-items: center; gap: 6px; }
      #tb-picker .wpick img { width: 18px; height: 18px; }
      body[data-screen='hunt'] #topbar { display: none; }
      .bonus-tag { font: 700 10px var(--pixel); color: #1a1406; background: #3fc7a0; border-radius: 3px; padding: 1px 4px; margin-left: 4px; letter-spacing: .04em; vertical-align: middle; }
      .eqs.bonus { box-shadow: inset 0 0 0 2px #3fc7a0; }
      .bonus-pool { color: #3fc7a0; }
      .auto-pill { border-radius: 10px; padding: 1px 8px; font-size: 12px; border: 1px solid var(--edge); }
      .auto-pill.on { color: #3fc7a0; border-color: #3fc7a0; }
      .auto-pill.off { opacity: 0.7; }
      .showcase-badge { background: #6b4bd6; color: #fff; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
      body[data-showcase] [data-act='claim'], body[data-showcase] [data-act='net-deposit'], body[data-showcase] #tb-depamt,
      body[data-showcase] #tb-claimhint, body[data-showcase] #tb-faucet,
      body[data-showcase] [data-act^='sell'], body[data-showcase] [data-act^='mk-buy'] { display: none !important; }

      /* ---------- lobby ---------- */
      #lobby { position: relative; min-height: calc(100vh - 50px); display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-items: start; padding: 6vh 18px 40px;
        background: linear-gradient(180deg, #0b0b0dcc 0%, #0b0b0d99 40%, #141412f2 100%), url('art/ui/wallpaper.jpg') center 30% / cover no-repeat fixed; }
      .lobby-inner { width: min(1080px, 100%); display: flex; flex-direction: column; gap: 22px; }
      .logo { margin: 0; font: 700 clamp(34px, 6vw, 64px) var(--pixel); color: var(--gold); text-shadow: 0 4px 0 #000, 0 0 24px #e8c34e40; letter-spacing: .02em; line-height: 1; }
      .tagline { margin: -10px 0 4px; color: var(--dim); font-size: 16px; }
      #tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
      .community { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin: 14px 0 4px; font: 600 13px var(--body); color: #cdbb8a; }
      a.comm { color: #fff; text-decoration: none; padding: 5px 14px; border-radius: 4px; box-shadow: var(--bevel); border: 1px solid rgba(255,255,255,.25); }
      a.comm.discord { background: #5865f2; }
      a.comm.telegram { background: #229ed9; }
      a.comm.tiktok { background: #111; }
      a.comm:hover { filter: brightness(1.15); }
      .tile { position: relative; display: grid; grid-template-columns: 64px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left; padding: 14px 14px; min-height: 92px;
        background: linear-gradient(160deg, #3a3935f0, #252422f0); border: 1px solid var(--edge); border-radius: 6px; box-shadow: var(--bevel), 0 6px 16px #0007;
        animation: rise .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 45ms); }
      .tile::after { content: ''; position: absolute; inset: 3px; border: 1px solid #ffffff0a; border-radius: 4px; pointer-events: none; }
      .tile img { grid-row: 1 / 3; width: 64px; height: 64px; image-rendering: pixelated; object-fit: contain; filter: drop-shadow(0 3px 0 #0009); transition: transform .15s; }
      .tile:hover img { transform: translateY(-3px) scale(1.06); }
      .tile .tt { font: 700 17px var(--pixel); color: var(--ink); align-self: end; }
      .tile .tt.long { font-size: 13px; letter-spacing: -0.5px; white-space: nowrap; } /* OWNER 2026-10-27: "Expeditions" fits the tile */
      .tile .ts { font-size: 13px; color: var(--dim); align-self: start; }
      .tile.primary { grid-column: span 2; min-height: 120px; background: linear-gradient(160deg, #5a4718f2, #2d2412f2); border-color: var(--gold-d); }
      .tile.primary .tt { font-size: 26px; color: var(--gold); }
      .tile.primary img { width: 80px; height: 80px; }
      .tile.primary { grid-template-columns: 80px 1fr; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .lstat { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 10px 14px; background: #1b1b19cc; border: 1px solid var(--edge); border-radius: 6px; color: var(--dim); font-size: 14px; }
      .lstat b { color: var(--gold); font: 700 15px var(--pixel); margin-right: 4px; }
      @keyframes pulse { 50% { transform: scale(1.12); } }
      /* jail cage reward bags: lobby tile badge, hunt bar chip, Rewards page */
      .tbadge { position: absolute; top: 6px; right: 8px; min-width: 22px; padding: 2px 6px; border-radius: 11px; background: #e53935; color: #fff; font: 700 12px/1.2 var(--pixel); text-align: center; box-shadow: 0 0 0 2px #000a; animation: pulse 1.6s ease-in-out infinite; }
      .bagchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; margin-right: 6px; border: 1px solid var(--gold); background: #3a2e0fcc; border-radius: 4px; color: var(--gold); cursor: pointer; }
      .bagchip img { width: 24px; height: 24px; image-rendering: pixelated; } .bagchip b { font: 700 13px var(--pixel); }
      .bagbox { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
      .bagimg { width: 96px; height: 96px; image-rendering: pixelated; filter: drop-shadow(0 0 10px #c03fd066); }
      .bagbox h3 { margin: 0 0 6px; } table.odds { border-collapse: collapse; width: auto; min-width: 260px; } table.odds td { padding: 3px 12px 3px 0; border-bottom: 1px solid #ffffff14; } .tblwrap { overflow-x: auto; } .racebox { border: 1px solid #e8c34e55; border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; background: linear-gradient(180deg, #e8c34e14, transparent); } .racebox h3 { margin: 2px 0 4px; } table.sales { border-collapse: collapse; width: 100%; } table.sales th { text-align: left; font-weight: 600; opacity: .7; padding: 4px 10px 4px 0; } table.sales td { padding: 4px 10px 4px 0; border-bottom: 1px solid #ffffff14; white-space: nowrap; }
      .evhud { flex-basis: 100%; padding: 3px 8px; margin-bottom: 4px; background: #3a2e0fcc; border: 1px solid var(--gold); border-radius: 4px; color: var(--gold); font-size: 12px; }
      .promo { margin-bottom: 8px; padding: 8px 12px; background: #3a2e0fcc; border: 1px solid var(--gold); border-radius: 6px; color: var(--gold); font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
      .promo b { font: 700 14px var(--pixel); }
      .invite { margin-bottom: 8px; padding: 8px 12px; background: #1b1b19cc; border: 1px solid var(--edge); border-radius: 6px; font-size: 13px; color: var(--dim); display: grid; gap: 6px; }
      .invite b { color: var(--gold); }
      .invrow { display: flex; gap: 6px; min-width: 0; }
      .invrow input { flex: 1; min-width: 0; font-size: 12px; }
      .feed { margin: 0; padding: 8px 14px 8px 32px; background: #1b1b19aa; border: 1px solid #ffffff10; border-radius: 6px; font-size: 13px; color: var(--dim); }

      /* ---------- full-screen pages ---------- */
      #page { min-height: calc(100vh - 50px); padding: 0 0 40px; background: radial-gradient(1200px 500px at 50% -10%, #3a352544, transparent), linear-gradient(180deg, #1c1b19b8, #141412e0), url('art/ui/wallpaper.jpg') center 30% / cover no-repeat fixed, var(--s1); }
      .pagehead { position: sticky; top: 49px; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 12px 22px; background: #232321f2; border-bottom: 1px solid var(--edge); }
      .pagehead h2 { margin: 0; font: 700 22px var(--pixel); color: var(--gold); text-shadow: 0 2px 0 #000; }
      .back { font-weight: 800; }
      #panel { width: min(1240px, 100%); margin: 0 auto; padding: 16px 22px; display: grid; gap: 10px; align-content: start; }
      #panel h3 { margin: 6px 0 4px; font: 700 15px var(--pixel); color: var(--gold); }
      #panel h4 { margin: 12px 0 4px; color: var(--dim); font: 700 12px var(--pixel); text-transform: uppercase; letter-spacing: .06em; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card); border: 1px solid #ffffff10; border-radius: 6px; box-shadow: var(--bevel); }
      .row.col { flex-direction: column; align-items: stretch; }
      .row.tight { padding: 6px 10px; }
      .btns { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
      .subtabs { display: flex; gap: 5px; margin-bottom: 2px; }
      .subtabs.big button { font: 700 14px var(--pixel); padding: 6px 16px; }
      .off { color: #111; background: var(--good); border-radius: 3px; padding: 0 5px; font-size: 12px; font-weight: 800; }
      .reveal { background: var(--card); border-radius: 6px; padding: 8px 10px; border: 1px solid #ffffff10; }
      .field { display: flex; flex-direction: column; gap: 3px; margin: 2px 0; color: var(--dim); font-size: 13px; }
      .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
      .tbl td, .tbl th { text-align: left; padding: 5px 8px; border-bottom: 1px solid #ffffff12; }
      .tbl th { color: var(--dim); font: 700 11px var(--pixel); text-transform: uppercase; }
      .st { font-size: 12px; color: var(--dim); }
      .st-working { color: var(--good); } .st-resting { color: #64b5f6; }
      .st-training { color: #ffb74d; }
      .dbtn { display: flex; flex-direction: column; gap: 3px; }
      .hacts .sm { flex: 1; }
      .row.dummy { justify-content: flex-start; }
      .row.dummy .dtx { flex: 1; min-width: 0; }
      img.dimg { width: 64px; height: 64px; image-rendering: pixelated; object-fit: contain; flex: none; filter: drop-shadow(0 3px 0 #0008); }
      img.dimg.sm { width: 48px; height: 48px; }
      .dslots { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
      .dslot { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #0000004d; border: 1px solid #ffffff12; border-radius: 4px; font-size: 14px; }
      .dslot span { flex: 1; min-width: 0; }
      .dslot.empty { color: var(--dim); justify-content: center; min-height: 54px; border-style: dashed; }
      /* page grids */
      body[data-screen='heroes'] #panel, body[data-screen='items'] #panel { grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); }
      body[data-screen='heroes'] #panel > :not(.hcard), body[data-screen='items'] #panel > :not(.row.tight) { grid-column: 1 / -1; }
      body[data-screen='shop'] #panel { grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
      body[data-screen='training'] #panel { grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); }
      body[data-screen='shop'] #panel > h4, body[data-screen='shop'] #panel > .reveal, body[data-screen='shop'] #panel > p,
      body[data-screen='training'] #panel > h4, body[data-screen='training'] #panel > p { grid-column: 1 / -1; }
      .forge { display: grid; gap: 10px; }
      .rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 14px; }
      .rcard { background: var(--card); border: 1px solid #ffffff10; border-radius: 6px; padding: 10px 14px; box-shadow: var(--bevel); }
      img.mi { width: 32px; height: 32px; image-rendering: pixelated; vertical-align: middle; margin-right: 6px; }

      /* ---------- items, icons, hero card, equipment ---------- */
      img.ico { width: 32px; height: 32px; box-sizing: content-box; border: 2px solid #9e9e9e; border-radius: 4px; background: #0003; image-rendering: pixelated; vertical-align: middle; flex: none; object-fit: contain; }
      .por { display: inline-block; width: 48px; height: 48px; image-rendering: pixelated; vertical-align: middle; flex: none; }
      .il { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
      .row > .il { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; }
      .row > .btns { flex: none; }
      .rv { display: inline-flex; align-items: center; gap: 4px; margin: 2px 10px 2px 0; }
      .icons { display: flex; gap: 3px; margin-top: 4px; }
      .hcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 8px; padding: 10px 12px; background: var(--card); border: 1px solid #ffffff12; border-radius: 6px; box-shadow: var(--bevel); }
      .hcard.sel { border-color: var(--gold); }
      .hl { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
      .hcard .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .nmt { min-width: 0; }
      .nm1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .role { font: 700 8px var(--pixel); letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; flex: none; }
      .m-name { font-size: 16px; font-weight: 800; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .m-meta { font-size: 12px; color: var(--dim); }
      .ebar { position: relative; height: 13px; background: #0000008c; border-radius: 3px; overflow: hidden; box-shadow: inset 0 1px 2px #0009; margin-top: 2px; }
      .ebar i { display: block; height: 100%; background: linear-gradient(180deg, #e88a8a 0%, #c62f2f 45%, #8e1f1f 100%); transition: width .25s ease; }
      .ebar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; line-height: 1; }
      .srow { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .srow b { color: var(--ink); }
      .srow { display: flex; flex-wrap: wrap; gap: 2px 10px; white-space: normal; }
      /* OWNER 2026-10-27: hero fusion, the player taps the 4 heroes */
      .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: 8px 0; }
      .fpick { display: block; text-align: left; padding: 8px 10px; background: var(--card); border: 2px solid #ffffff12; border-radius: 6px; color: var(--ink); cursor: pointer; }
      .fpick .nm { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
      .exhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 6px 0 10px; }
      .exoffers { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
      .exoffer { display: block; text-align: left; padding: 10px 12px; background: var(--card); border: 2px solid; border-radius: 6px; color: var(--ink); cursor: pointer; }
      .exoffer.exsel { box-shadow: 0 0 0 3px #e8b84a; background: #e8b84a1f; }
      .exoffer .extt { font-weight: 700; }
      .exoffer .exrw { font-size: 22px; font-weight: 800; color: #e8b84a; margin: 2px 0; }
      .exchance { color: #5ac86e; font-size: 18px; }
      .exok { color: #e8b84a; }
      .exready, .exwon { color: #5ac86e; font-weight: 700; }
      .exheroes { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
      .fpick.fsel { border-color: #e8b84a; background: #e8b84a1f; }
      .fpick:disabled { opacity: 0.45; cursor: default; }
      .srow2 { font-size: 12px; color: var(--dim); }
      .srow2 b { color: var(--ink); }
      .stt .bon { color: var(--dim); font-style: normal; font-size: 12px; }
      #tb-online .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4caf50; box-shadow: 0 0 6px #4caf50; margin-right: 5px; vertical-align: middle; }
      .stake-warn { background: rgba(232,184,74,.12); border: 1px solid #e8b84a; border-radius: 8px; padding: 8px 10px; }
      .stt .stk { color: #e8b84a; font-style: normal; font-size: 12px; }
      .perks { font-size: 12px; color: var(--dim); display: grid; gap: 1px; }
      .perk b { color: var(--ink); }
      .hacts { grid-column: 1 / -1; display: flex; gap: 6px; align-self: end; align-items: flex-start; }
      .hacts button { flex: 1; }
      .eqgrid { display: grid; grid-template-columns: repeat(3, 34px); grid-auto-rows: 34px; gap: 2px; align-self: start; padding: 3px; background: #0c0c11; border: 1px solid #ffffff12; border-radius: 4px; }
      .eqs { position: relative; display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 1px solid #ffffff12; border-radius: 3px; background: #00000061; box-shadow: inset 0 1px 3px #00000080; cursor: pointer; }
      .eqs:active:not(:disabled) { transform: none; }
      .eqs img { width: 32px; height: 32px; image-rendering: pixelated; object-fit: contain; }
      .eqs.open { outline: 1px solid var(--gold); }
      .eqs .sil { width: 22px; height: 22px; fill: #ffffff1c; }
      .eqs.off { cursor: default; opacity: .45; }
      .eqs.off .sil { fill: #ffffff10; }
      .eqs.void { background: transparent; border: 0; box-shadow: none; cursor: default; }
